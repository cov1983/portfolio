# Phase 0b CI. Job ids stay stable across phases: lint, test and gitleaks are the required status
# checks on main today; build joins them when the ruleset is updated (Phase 0b PR 4), and Vercel's
# Deployment Checks match the same names. Every job runs the make targets a developer runs locally,
# so a green `make verify` predicts a green pipeline.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Format check, ESLint, type check
        run: make format-check lint typecheck

      - name: CLAUDE.md and AGENTS.md are identical and at most 150 lines
        run: |
          cmp CLAUDE.md AGENTS.md
          lines=$(wc -l < CLAUDE.md)
          if [ "$lines" -gt 150 ]; then echo "CLAUDE.md has $lines lines; the limit is 150"; exit 1; fi

      - name: Shell scripts pass shellcheck
        run: shellcheck .claude/hooks/*.sh .claude/hooks/tests/run.sh

      - name: .claude/settings.json is valid JSON
        run: jq empty .claude/settings.json

      - name: guard-bash hook smoke test
        run: .claude/hooks/tests/run.sh

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Unit tests with coverage (ratchet thresholds in vitest.config.ts)
        run: make test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Production build
        run: make build

      - name: Compressed asset sizes (budget gate lands with the perf job)
        run: |
          shopt -s nullglob
          total=0
          sizes=$(mktemp)
          for f in dist/assets/*; do
            size=$(gzip -9c "$f" | wc -c)
            total=$((total + size))
            printf '%10d  %s\n' "$size" "$f" >> "$sizes"
          done
          sort -rn "$sizes"
          echo "total gzip bytes: $total"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1' # same binary as .devcontainer/Dockerfile
